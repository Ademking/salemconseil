            display: flex;

            justify-content: center;

        .iframe-wrapper {
            position: relative;
            width: min(1240px, 95vw);
            aspect-ratio: 16/9;
            background: #111;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
        }

        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .fs-btn {
            position: absolute;
            right: 8px;
            top: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 0;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        /* When the wrapper is fullscreen, make iframe fill the screen */
        :fullscreen .iframe-wrapper,
        :-webkit-full-screen .iframe-wrapper,
        :-ms-fullscreen .iframe-wrapper {
            width: 100vw;
            height: 100vh;
        }

<body>
    <div class="iframe-wrapper" id="iframeWrapper">
        <button class="fs-btn" id="fsBtn" title="Enter fullscreen">⤢ Plein écran</button>
        <iframe id="embeddedIframe"
            src="https://1drv.ms/p/c/f74390d81063cb7b/IQRXvz_YwV9qS5fiHlEGkn5fAYLzLuGfKQJOLkNgtlBE5Rg" scrolling="no"
            allow="fullscreen" allowfullscreen mozallowfullscreen="true" webkitallowfullscreen="true"
            referrerpolicy="no-referrer">
        </iframe>

    </div>

    <script>
        (function () {
            const wrapper = document.getElementById('iframeWrapper');
            const btn = document.getElementById('fsBtn');

            // Cross-browser requestFullscreen
            function enterFullScreen(el) {
                if (el.requestFullscreen) return el.requestFullscreen();
                if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
                if (el.mozRequestFullScreen) return el.mozRequestFullScreen();
                if (el.msRequestFullscreen) return el.msRequestFullscreen();
                return Promise.reject(new Error('Fullscreen API is not supported'));
            }

            function exitFullScreen() {
                if (document.exitFullscreen) return document.exitFullscreen();
                if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
                if (document.mozCancelFullScreen) return document.mozCancelFullScreen();
                if (document.msExitFullscreen) return document.msExitFullscreen();
                return Promise.reject(new Error('Fullscreen API is not supported'));
            }

            btn.addEventListener('click', function () {
                const isFs = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                if (!isFs) {
                    enterFullScreen(wrapper).catch(err => console.warn(err));
                } else {
                    exitFullScreen().catch(err => console.warn(err));
                }
            });

            // Update button text when fullscreen changes
            ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
                document.addEventListener(evt, () => {
                    const isFsNow = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                    btn.textContent = isFsNow ? '⤢ Quitter le mode plein écran' : '⤢ Plein écran';
                });
            });
        })();
    </script>
